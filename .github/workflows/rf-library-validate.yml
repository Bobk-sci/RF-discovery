name: rf-library-validate
# Lint, typage et tests à chaque modification du code (aucun accès réseau : fixtures).

on:
  push:
    paths:
      - 'rf-discovery/src/**'
      - 'rf-discovery/tests/**'
      - 'rf-discovery/config/**'
      - 'rf-discovery/pyproject.toml'
      - '.github/workflows/rf-library-validate.yml'
  pull_request:
    paths:
      - 'rf-discovery/**'

defaults:
  run:
    working-directory: rf-discovery

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
