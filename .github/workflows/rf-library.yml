name: rf-library
# Veille bibliographique RF : collecte Europe PMC + PubMed, classement en sous-dossiers,
# commit de `rf-discovery/articles/`. Déclenchable à la main depuis le téléphone
# (onglet Actions -> rf-library -> Run workflow).

on:
  schedule:
    - cron: '0 5 * * 1'      # lundi 05:00 UTC
  push:
    # Tant que ce fichier n'est pas sur `main`, le bouton « Run workflow » de l'onglet
    # Actions ne l'affiche pas : GitHub n'enregistre les `workflow_dispatch` que depuis
    # la branche par défaut. Un déclencheur `push` sur la branche de travail, lui,
    # fonctionne tout de suite. `articles/` est exclu pour éviter la boucle (le run
    # committe ses propres résultats).
    branches: [main, claude/rf-discovery-pipeline-035bd2]
    paths:
      - 'rf-discovery/config/taxonomy.yaml'
      - 'rf-discovery/src/library/**'
      - 'rf-discovery/src/collect_library.py'
      - 'rf-discovery/src/collect/**'
      - '.github/workflows/rf-library.yml'
  workflow_dispatch:
    inputs:
      max_results:
        description: "Plafond d'articles par source"
        default: '1000'
      sources:
        description: 'Sources interrogées (europepmc,pubmed,openalex,emfportal)'
        default: 'europepmc,pubmed'
      tout:
        description: 'Tout re-collecter en ignorant la mémoire de déduplication'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: rf-discovery
    shell: bash -eo pipefail {0}

concurrency:
  group: rf-library
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Collect and file articles
        env:
          # Le courriel est demandé par les E-utilities du NCBI ; la clé API (facultative)
          # relève seulement le quota. Tout passe par les secrets, jamais par le YAML.
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # Le message de commit passe par l'environnement, jamais par interpolation
          # directe dans le shell : il contient du texte libre.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          IN_TOUT: ${{ inputs.tout }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_MAX: ${{ inputs.max_results }}
        # Un push ne peut pas passer d'`inputs` : deux signaux se lisent donc dans le
        # message de commit. `[tout]` force une re-collecte complète (utile quand les
        # fiches doivent être réécrites, par exemple pour un nouveau champ) et
        # `[openalex]` ajoute le filet OpenAlex à la collecte de ce run.
        run: |
          TOUT=""
          if [ "$IN_TOUT" = "true" ] || printf '%s' "$COMMIT_MSG" | grep -q '\[tout\]'; then
            TOUT="--tout"
          fi
          SOURCES="${IN_SOURCES:-europepmc,pubmed}"
          if printf '%s' "$COMMIT_MSG" | grep -q '\[openalex\]'; then
            case "$SOURCES" in *openalex*) ;; *) SOURCES="$SOURCES,openalex" ;; esac
          fi
          echo "Sources : $SOURCES"
          python -m collect_library \
            --sources "$SOURCES" \
            --max-results "${IN_MAX:-1000}" \
            $TOUT | tee library.json

      - name: Complete missing metadata
        # Une fiche sans auteurs est inutilisable dans EndNote/Zotero : on relit sa
        # notice PubMed par identifiant (quelques appels), au lieu d'espérer qu'une
        # nouvelle recherche la ramène.
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m collect_library --completer | tee completion.json

      - name: Export references (RIS / BibTeX)
        # Formats lus par EndNote et Zotero ; régénérés à chaque run pour rester à jour.
        run: python -m export_refs | tee refs.json

      - name: Commit library
        run: |
          git config user.name  "rf-library-bot"
          git config user.email "${{ secrets.CONTACT_EMAIL || 'bot@example.com' }}"
          git add articles data/seen_library.json
          git commit -m "Veille RF $(date -u +%F)" || echo "rien de nouveau cette semaine"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Veille RF $(date -u +%F)"
            echo ''
            echo '```json'
            cat library.json 2>/dev/null || echo '{}'
            echo '```'
            sed -n '1,25p' articles/README.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
