# Deux domaines pour les tests du harvester : une source (avec termes RF) et un pont (sans).
rf_terms:
  - "radiofrequency electromagnetic field"
  - "GSM"

domains:
  - name: rf_in_vitro_test
    query: "neuron"
    sources: [europepmc, pubtator]
    rf_terms_allowed: true
    weight: 1.0
  - name: neurodevelopment_test
    query: "neurodevelopment"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 1.0
