# Domaines interrogés par le pipeline.
# rf_terms_allowed=true  -> requête combinée avec les termes CEM-RF (domaines-source).
# rf_terms_allowed=false -> requête SANS aucun terme RF (domaines-cible/ponts).
#   Règle cardinale (§3) : un domaine-pont filtré par des termes RF ne peut
#   mathématiquement que redécouvrir l'existant.

rf_terms:
  - "radiofrequency electromagnetic field"
  - "mobile phone radiation"
  - "GSM"
  - "Wi-Fi exposure"
  - "specific absorption rate"
  - "900 MHz"
  - "1800 MHz"
  - "2.45 GHz"

domains:
  # --- Domaines-source (avec termes RF) ---
  - name: rf_in_vivo
    query: "(rat OR mouse OR animal) AND brain"
    sources: [europepmc, ncbi]
    rf_terms_allowed: true
    weight: 1.0
  - name: rf_in_vitro
    query: "(neuron OR cell culture OR SH-SY5Y OR PC12)"
    sources: [europepmc, ncbi]
    rf_terms_allowed: true
    weight: 1.0
  - name: rf_dosimetry
    query: "(SAR OR exposure system OR sham OR modulation OR dosimetry)"
    sources: [europepmc, arxiv]
    rf_terms_allowed: true
    weight: 0.8

  # --- Domaines-cible et ponts (SANS termes RF) ---
  - name: neurodevelopment
    query: "neurodevelopment AND (cortex OR neurogenesis OR migration)"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 1.0
  - name: neurotoxicity
    query: "neurotoxicity AND mechanism"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 1.0
  - name: oxidative_stress
    query: "oxidative stress AND (Nrf2 OR redox) AND brain"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.9
  - name: neuroinflammation
    query: "neuroinflammation AND (microglia OR astrocyte)"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.9
  - name: bbb_permeability
    query: "blood brain barrier permeability"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.8
  - name: epigenetics_dohad
    query: "(DNA methylation OR miRNA) AND (perinatal OR developmental programming)"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.8
  - name: synaptic_plasticity
    query: "(long term potentiation OR synaptic plasticity OR oscillations) AND hippocampus"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.9
  - name: mitochondrial_bioenergetics
    query: "mitochondrial bioenergetics AND neuron"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.8
  - name: calcium_ion_channels
    query: "(voltage gated calcium channel OR TRP channel) AND neuron"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.8
  - name: developmental_neurotoxicants
    query: "developmental neurotoxicity AND (metal OR pesticide OR endocrine disruptor OR PM2.5)"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.9
  - name: developmental_hyperthermia
    query: "developmental hyperthermia AND brain"
    sources: [europepmc, pubtator]
    rf_terms_allowed: false
    weight: 0.7
  - name: radical_pair_magnetoreception
    query: "(cryptochrome OR radical pair) AND magnetoreception"
    sources: [europepmc, arxiv]
    rf_terms_allowed: false
    weight: 0.6
