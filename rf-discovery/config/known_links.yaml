# Couples toxique -> pathologie ÉTABLIS, servant de vérité terrain à la validation
# prospective (src/validate/prospective.py).
#
# Protocole : on gèle le graphe à `cutoff`, on efface le lien direct, et on demande au
# moteur de classer le couple parmi des composés témoins appariés en degré. Un couple
# dont la reconnaissance est POSTÉRIEURE au gel constitue un test prospectif : le moteur
# n'a accès ni au lien, ni à la littérature ultérieure.
#
# `recognised` = année approximative de reconnaissance dans la littérature. Choisir un
# `cutoff` strictement antérieur pour que le test soit prospectif.

links:
  - chemical: "MESH:D014635"     # Acide valproïque
    disease: "MESH:D001321"      # Autisme
    label: "Acide valproïque -> Autisme"
    recognised: 2013
  - chemical: "MESH:C006780"     # Bisphénol A
    disease: "MESH:D001321"      # Autisme
    label: "Bisphénol A -> Autisme"
    recognised: 2012
  - chemical: "MESH:D010269"     # Paraquat
    disease: "MESH:D010300"      # Parkinson
    label: "Paraquat -> Parkinson"
    recognised: 2011
  - chemical: "MESH:D004390"     # Chlorpyrifos
    disease: "MESH:D002658"      # Troubles du développement cognitif
    label: "Chlorpyrifos -> Développement cognitif"
    recognised: 2011
  - chemical: "MESH:D012402"     # Roténone
    disease: "MESH:D010300"      # Parkinson
    label: "Roténone -> Parkinson"
    recognised: 2011
  - chemical: "MESH:D015632"     # MPTP
    disease: "MESH:D010300"      # Parkinson
    label: "MPTP -> Parkinson"
    recognised: 1983
  - chemical: "MESH:D008767"     # Méthylmercure
    disease: "MESH:D009422"      # Syndrome neurotoxique
    label: "Méthylmercure -> Sd neurotoxique"
    recognised: 1970
  - chemical: "MESH:D000431"     # Éthanol
    disease: "MESH:D063647"      # Troubles de l'alcoolisation fœtale
    label: "Éthanol -> Tr. alcoolisation fœtale"
    recognised: 1973

# Critère de réussite : percentile MÉDIAN des couples testés (le hasard donne 50 %).
median_percentile_max: 10.0
n_controls: 300
