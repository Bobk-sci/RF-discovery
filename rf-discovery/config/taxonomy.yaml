# Taxonomie de la bibliothèque RF — classement déterministe par mots-clés.
#
# Deux axes -> deux niveaux de dossiers : articles/<modele>/<theme>/
#   axe 1 "modele" : comment l'étude a été faite (in vivo, in vitro, épidémio, revue...)
#   axe 2 "theme"  : sur quoi elle porte (neuro, développement, stress oxydatif...)
#
# Aucun LLM, aucune clé d'API : le classement est un comptage de mots-clés pondéré,
# donc reproductible, vérifiable et modifiable ici sans toucher au code.
# Une occurrence dans le TITRE compte `title_boost` fois plus que dans le résumé.
# Sous `min_score`, l'article tombe dans la catégorie `default` de l'axe.

recherche:
  # Corpus : tout ce qui touche aux radiofréquences. Sert de requête Europe PMC.
  rf_terms:
    - "radiofrequency electromagnetic field"
    - "radiofrequency radiation"
    - "radiofrequency exposure"
    - "electromagnetic field exposure"
    - "microwave radiation"
    - "microwave exposure"
    # Ni « base station » ni « cell tower » : ces mots définissent toute la littérature
    # télécom (drones-relais, beamforming, routage). Les études d'exposition aux
    # antennes-relais portent de toute façon « radiofrequency » ou « exposure ».
    - "electromagnetic hypersensitivity"
    - "radar exposure"
    - "5G exposure"
    - "3.5 GHz"
    - "mobile phone radiation"
    - "cell phone radiation"
    - "wireless radiation"
    - "Wi-Fi exposure"
    - "GSM exposure"
    - "UMTS exposure"
    - "LTE exposure"
    - "5G exposure"
    - "millimeter wave exposure"
    - "specific absorption rate"
    - "900 MHz"
    - "1800 MHz"
    - "2.45 GHz"
  # Filtres Europe PMC ajoutés à la requête (résumé obligatoire : sans lui, pas de classement).
  filtres: "HAS_ABSTRACT:Y"
  annee_min: 1990
  # Garde-fou : une notice doit contenir au moins un de ces termes, sinon elle est
  # écartée. Constaté sur des notices réelles : sans ce filtre, « GSM » ramène des
  # articles sur la *géosmine* (traitement de l'eau) et « Wi-Fi » des capteurs d'humidité
  # des sols. Plus large que rf_terms, qui sert à interroger les bases.
  pertinence:
    - "radiofrequency"
    - "radio frequency"
    - "radiofrequencies"
    - "electromagnetic field"
    - "electromagnetic fields"
    - "electromagnetic radiation"
    - "microwave"
    - "microwaves"
    - "mobile phone"
    - "cell phone"
    - "cellular phone"
    - "base station"
    - "Wi-Fi exposure"
    - "WiFi exposure"
    - "Wi-Fi radiation"          # « Wi-Fi » seul ramènerait des capteurs d'humidité du sol
    - "WiFi radiation"
    - "Wi-Fi router"
    - "wireless exposure"
    - "millimeter wave"
    - "specific absorption rate"
    - "GSM exposure"
    - "UMTS"
    - "5G"
    # Bandes citées telles quelles dans les titres de cette littérature.
    - "900 MHz"
    - "1800 MHz"
    - "2100 MHz"
    - "2450 MHz"
    - "1.8 GHz"
    - "2.45 GHz"
    - "3.5 GHz"
  # Second garde-fou, devenu indispensable après l'élargissement du vocabulaire : un terme
  # RF ne suffit pas, car toute la littérature télécom parle de micro-ondes et d'ondes
  # millimétriques. La notice doit aussi porter une marque d'étude biologique, sanitaire
  # ou de mesure d'exposition — sans quoi des algorithmes de routage et des drones-relais
  # entrent dans le corpus. Plus robuste qu'une liste noire de sujets télécom, toujours
  # incomplète.
  pertinence_bio:
    - "exposure"
    - "exposed"
    - "health"
    - "biological effect"
    - "biological effects"
    - "bioeffect"
    - "toxicity"
    - "cells"
    - "cell viability"
    - "tissue"
    - "tissues"
    - "brain"
    - "rats"
    - "mice"
    - "animals"
    - "patients"
    - "volunteers"
    - "children"
    - "pregnancy"
    - "tumor"
    - "tumour"
    - "cancer"
    - "DNA"
    - "oxidative"
    - "apoptosis"
    - "cognitive"
    - "sleep"
    - "EEG"
    - "sperm"
    - "fertility"
    - "epidemiological"
    - "dosimetry"
    - "specific absorption rate"
    - "SAR"
    - "ICNIRP"
    - "exposure limits"
    - "safety guidelines"
  # Écartés du corpus (recherche sur le TITRE, les MeSH et le type de publication).
  # « specific absorption rate » ramène beaucoup de méthodologie IRM, sans rapport avec
  # l'exposition environnementale : mieux vaut exclure que classer de force.
  # `sauf_si` annule UNE exclusion donnée : les marques propres aux études d'exposition
  # sauvent une étude de provocation mesurée par IRM, sans sauver pour autant un article
  # sur l'addiction au téléphone (une annulation globale ferait cette confusion).
  marques_exposition: &marques_exposition
    - "sham"
    - "sham exposure"
    - "sham-exposed"
    - "exposure system"
    - "whole-body exposure"
    - "head exposure"
    - "occupational exposure"
    - "environmental exposure"
    - "provocation"
    - "ICNIRP"
    # Marques d'étude épidémiologique : sans elles, une étude « schwannome vestibulaire
    # et usage du téléphone » tombait dans l'exclusion IRM (le diagnostic passe par l'IRM).
    - "mobile phone use"
    - "cell phone use"
    - "case-control"
    - "cohort"
    - "odds ratio"
    - "epidemiological"
    - "cumulative call time"
  exclusions:
    - terme: "pulse sequence"
      sauf_si: *marques_exposition
    - terme: "radiofrequency coil"
      sauf_si: *marques_exposition
    - terme: "RF coil"
      sauf_si: *marques_exposition
    - terme: "transmit coil"
      sauf_si: *marques_exposition
    - terme: "parallel transmission"
      sauf_si: *marques_exposition
    - terme: "image reconstruction"
      sauf_si: *marques_exposition
    - terme: "magnetic resonance angiography"
      sauf_si: *marques_exposition
    - terme: "arterial spin labeling"
      sauf_si: *marques_exposition
    - terme: "magnetic resonance spectroscopy"
      sauf_si: *marques_exposition
    - terme: "Magnetic Resonance Imaging"   # descripteur MeSH des articles de méthode IRM
      sauf_si: *marques_exposition
    # Micro-ondes industrielles : même physique, autre sujet que l'exposition humaine.
    - "wastewater"
    - "phytotreatment"
    - "soil moisture"
    - "microwave-assisted synthesis"
    - "microwave synthesis"
    # Le téléphone comme objet d'usage, pas comme source d'exposition.
    - "phone addiction"
    - "smartphone addiction"
    - "problematic smartphone use"
    - "mobile health"
    - "mHealth"
    - "telemedicine"
    - "screening intervention"
    - "wireless body area network"
    # L'écran plutôt que l'onde : études d'usage, de sommeil-écran, de distraction.
    - "screen time"
    - "bedtime phone use"
    - "phone distraction"
    - "distracted driving"
    - "driving"
    - "sleep hygiene"
    - "mobile usage"
    # Micro-ondes thérapeutiques ou chirurgicales : l'onde est l'outil, pas l'exposition.
    - "microwave ablation"
    - "radiofrequency ablation"
    - "tumor ablation"
    - "thermal therapy"
    - "surgical device"
    - "skin laxity"
    - "osmidrosis"
    - "hyperhidrosis"
    - "hyperthermia treatment"
    # Micro-ondes comme instrument de mesure ou de fabrication.
    - "microwave imaging"
    - "microwave sensor"
    - "microwave drying"
    - "microwave extraction"
    - "microwave-assisted extraction"
    - "biosensor"
    - "sensor array"
    - "wireless sensor network"
    - "4G/5G"            # le polymorphisme génétique 4G/5G n'est pas une bande radio
    - "vacuum drying"
    - "accelerometer"
    - "cloud computing"
    - "digital health"
    # Ingénierie des réseaux : l'onde y est un canal de transmission, pas une exposition.
    # Liste courte et sans ambiguïté — le gros du tri est fait par `pertinence_bio`,
    # qui n'a pas besoin de connaître à l'avance chaque sujet télécom.
    - "beamforming"
    - "routing protocol"
    - "path loss model"
    - "network slicing"
    - "spectrum sharing"
    - "base station deployment"
    # Agroalimentaire et procédés industriels : même four, autre question. Pas « food »
    # seul : une étude réelle porte sur la prise alimentaire après exposition au téléphone.
    - "microwave thawing"
    - "meat processing"
    - "food processing"
    - "food quality"
    - "pasteurization"
    - "shelf life"
  # …sauf si la notice porte une vraie marque d'étude d'exposition : une étude de
  # provocation qui mesure l'effet d'un téléphone par IRM doit rester dans le corpus.
  annulations:
    - "sham"
    - "sham exposure"
    - "mobile phone"
    - "cell phone"
    - "base station"
    - "occupational exposure"
    - "environmental exposure"
    - "exposure system"
    - "whole-body exposure"
    - "head exposure"
    - "ICNIRP"

classement:
  title_boost: 2.5      # un mot-clé dans le titre pèse 2.5 fois celui du résumé
  meta_boost: 2.0       # un mot-clé dans les MeSH / type de publication : 2 fois
  min_score: 1.0        # en dessous : catégorie par défaut de l'axe
  max_secondaires: 3    # thèmes annexes notés dans l'en-tête et l'index

axes:
  # --------------------------------------------------------------------------
  - name: modele
    default: non_classe
    # L'ordre départage les ex æquo : une revue reste une revue même si elle
    # décrit des protocoles in vivo.
    categories:
      - name: revue
        # Types de publication attribués par PubMed : ils tranchent à eux seuls.
        decisifs:
          - "Review"
          - "Systematic Review"
          - "Meta-Analysis"
        keywords:
          - "review"
          - "systematic review"
          - "meta-analysis"
          - "meta analysis"
          - "scoping review"
          - "narrative review"
          - "state of the art"
          - "literature review"
          - "umbrella review"

      - name: epidemiologie
        decisifs:                    # descripteurs MeSH de plan d'étude
          - "Cohort Studies"
          - "Case-Control Studies"
          - "Cross-Sectional Studies"
          - "Prospective Studies"
        keywords:
          - "cohort"
          - "case-control"
          - "case control"
          - "cross-sectional"
          - "epidemiological"
          - "epidemiology"
          - "questionnaire"
          - "odds ratio"
          - "hazard ratio"
          - "confidence interval"
          - "participants"
          - "population-based"
          - "INTERPHONE"
          - "MOBI-Kids"
          - "COSMOS"
          - "self-reported"

      - name: humain_experimental
        keywords:
          - "healthy volunteers"
          - "human volunteers"
          - "volunteers"
          - "experimentally induced"
          - "exposure session"
          - "double-blind"
          - "provocation study"
          - "sham-controlled"
          - "crossover design"
          - "electrohypersensitivity"
          - "electromagnetic hypersensitivity"
          - "resting EEG"
          - "cognitive task"
          - "psychomotor vigilance"

      - name: in_vivo
        # « in vivo » dans le titre : les auteurs tranchent eux-mêmes (une tumeur greffée
        # chez le rat porte pourtant le descripteur MeSH « Cell Line, Tumor »).
        decisifs:
          - "in vivo"
        keywords:
          - "animals"                # descripteur MeSH
          - "rats"
          - "rat"
          - "mice"
          - "mouse"
          - "in vivo"
          - "Wistar"
          - "Sprague-Dawley"
          - "C57BL"
          - "zebrafish"
          - "Drosophila"
          - "rabbit"
          - "animal model"
          - "whole-body exposure"
          - "gestation"
          - "prenatal exposure"
          - "offspring"
          - "hippocampus"
          - "behavioral test"
          - "Morris water maze"
          - "open field test"

      - name: in_vitro
        # Descripteurs MeSH de lignée cellulaire : ils tranchent, car PubMed attribue
        # aussi « Animals »/« Mice » à une étude sur cellules issues de souris (NIH 3T3).
        # Liste explicite plutôt que « * Cells » : « Pyramidal Cells », « Hair Cells »
        # apparaissent dans de vraies études in vivo.
        decisifs:
          - "Cells, Cultured"
          - "Cell Line"
          - "Cell Line, Tumor"
          - "Cell Culture Techniques"
          - "Primary Cell Culture"
          - "In Vitro Techniques"
          - "NIH 3T3 Cells"
          - "3T3 Cells"
          - "HL-60 Cells"
          - "HeLa Cells"
          - "PC12 Cells"
          - "Jurkat Cells"
          - "K562 Cells"
          - "CHO Cells"
          - "HEK293 Cells"
        keywords:
          - "in vitro techniques"    # descripteur MeSH
          - "cells, cultured"        # descripteur MeSH
          - "in vitro"
          - "cell culture"
          - "cell line"
          - "cultured cells"
          - "SH-SY5Y"
          - "PC12"
          - "HEK293"
          - "HeLa"
          - "fibroblasts"
          - "lymphocytes"
          - "primary neurons"
          - "neuronal culture"
          - "organoid"
          - "spheroid"
          - "comet assay"
          - "MTT assay"
          - "flow cytometry"
          - "cytotoxicity"
          - "cell viability"
          - "cell proliferation"
          - "epithelial cells"
          - "iPSC"

      # Conception de matériel radio : ces articles citent le SAR pour prouver la
      # conformité d'une antenne, pas pour étudier un effet biologique. Ils ont leur
      # tiroir plutôt que d'être jetés : ils documentent les sources d'exposition.
      - name: ingenierie_materiel
        decisifs:
          - "antenna design"
          - "implantable antenna"
          - "wearable antenna"
          - "textile antenna"
          - "patch antenna"
          - "MIMO antenna"
          - "capsule endoscopy"
          - "rectenna"
          - "power divider"
          - "wireless power transfer"
          - "intra-body communication"
        keywords:
          # Pas « antenna » seul : les dispositifs d'exposition in vivo en ont aussi.
          - "MIMO"
          - "resonator"
          - "bandwidth"
          - "return loss"
          - "impedance matching"
          - "circularly polarized"
          - "communication link"
          - "dual-band"
          - "wideband"

      - name: dosimetrie_modelisation
        keywords:
          - "dosimetry"
          - "SAR"
          - "specific absorption rate"
          - "SAR distribution"
          - "numerical simulation"
          - "finite-difference time-domain"
          - "FDTD"
          - "anatomical model"
          - "phantom"
          - "exposure system"
          - "computational model"
          - "electromagnetic simulation"
          - "waveguide"
          - "transverse electromagnetic cell"
          - "TEM cell"
          - "reverberation chamber"
          - "exposure assessment"
          - "personal exposimeter"
          # Campagnes de mesure : de la dosimétrie aussi, pas seulement de la simulation.
          - "exposimeter"
          - "power density"
          - "field strength"
          - "exposure level"
          - "exposure levels"
          - "measured levels"
          - "in situ measurement"
          - "compliance distance"
          - "ICNIRP"
          - "reference level"
          - "exposure guidelines"
          - "exposure limits"
          - "safety standards"
          - "emission"
          - "emissions"

  # --------------------------------------------------------------------------
  - name: theme
    default: general
    categories:
      - name: neurodeveloppement
        keywords:
